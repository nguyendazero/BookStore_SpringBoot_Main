<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Bookstore</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/font-awesome.min.css}" rel="stylesheet">
    <link th:href="@{/css/style-admin.css}" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body>

<!-- Nếu chưa login hoặc không phải role=1 -->
<div th:if="${session.userLogin == null or session.userLogin.role != 1}"
     style="text-align: center; margin-top: 50px;">
    <h2 style="color: #d9534f; font-family: Arial, sans-serif;">
        You do not have access to this page
    </h2>
    <a th:href="@{/home}"
       style="display: inline-block; margin-top: 20px; padding: 10px 20px; background-color: #5bc0de; color: white; text-decoration: none; border-radius: 5px; font-size: 16px; font-weight: bold;">
        Go back to home
    </a>
</div>

<!-- Nếu đã login và role=1 -->
<div th:if="${session.userLogin != null and session.userLogin.role == 1}">

    <!-- Sidebar -->
    <div th:replace="partials/sidebar"></div>

    <!-- Page Content -->
    <div id="content">
        <!-- Navigation Bar -->
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <button type="button" id="sidebarCollapse" class="btn btn-primary">
                <i class="fa fa-bars"></i>
            </button>
            <a class="navbar-brand ms-3" href="#">Bookstore Admin</a>
            <div class="ml-auto">
                <a class="btn btn-secondary me-2">Profile</a>
                <a th:href="@{/user/logout}" class="btn btn-danger">Logout</a>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="container mt-4">
            <!-- Dashboard Statistics -->
            <div class="row">
                <div class="col-md-3">
                    <div class="card text-white bg-primary mb-4">
                        <div class="card-body">
                            <h5 class="card-title">Total Books</h5>
                            <p class="card-text" th:text="${totalBooks}"></p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-white bg-success mb-4">
                        <div class="card-body">
                            <h5 class="card-title">Total Orders</h5>
                            <p class="card-text" th:text="${totalOrders}"></p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-white bg-warning mb-4">
                        <div class="card-body">
                            <h5 class="card-title">Total User</h5>
                            <p class="card-text" th:text="${totalUsers}"></p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-white bg-danger mb-4">
                        <div class="card-body">
                            <h5 class="card-title">Total Category</h5>
                            <p class="card-text" th:text="${totalCategories}"></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Books Table -->
            <div class="row">
                <div class="col-md-12">
                    <h2>Book List</h2>
                    <table class="table table-striped">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Price</th>
                            <th>Status</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="book : ${books}">
                            <td th:text="${book.id}"></td>
                            <td th:text="${book.name}"></td>
                            <td th:text="${book.author.fullName}"></td>
                            <td th:text="${book.price}"></td>
                            <td><span th:text="${book.status}"></span></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Orders Table -->
            <div class="row mt-4">
                <div class="col-md-12">
                    <h2>Order List</h2>
                    <table class="table table-bordered">
                        <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Customer</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Date</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="order : ${orders}">
                            <td th:text="${order.id}"></td>
                            <td th:text="${order.user.fullName}"></td>
                            <td th:text="${order.total}"></td>
                            <td th:text="${order.status}"></td>
                            <td th:text="${order.date}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Users Table -->
            <div class="row mt-4">
                <div class="col-md-12">
                    <h2>User List</h2>
                    <table class="table table-striped">
                        <thead>
                        <tr>
                            <th>User ID</th>
                            <th>Họ tên</th>
                            <th>Email</th>
                            <th>Địa chỉ</th>
                            <th>Telephone</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.id}"></td>
                            <td th:text="${user.fullName}"></td>
                            <td th:text="${user.email}"></td>
                            <td th:text="${user.address}"></td>
                            <td th:text="${user.telephone}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
        </div>
    </div>
</div>

<!-- Scripts -->
<script th:src="@{/js/jquery.min.js}"></script>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/main-admin.js}"></script>
</body>
</html>
