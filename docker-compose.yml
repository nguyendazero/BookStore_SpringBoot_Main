networks:
  app-network:
    driver: bridge

volumes:
  mysql-data-bookstore:
    driver: local

services:
  mysql:
    image: "mysql:latest"
    container_name: mysql-data-bookstore
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data-bookstore:/var/lib/mysql
    networks:
      - app-network